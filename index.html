<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ABEL123 :: ORBITAL SENTINEL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0A0E14;
    --panel: #0F1621;
    --grid: #1A2332;
    --cyan: #4DE8E0;
    --violet: #9D7CFF;
    --red: #FF4D6D;
    --text-dim: #6B7A8F;
    --text: #D8E4F0;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      0deg, rgba(77,232,224,0.02) 0px, rgba(77,232,224,0.02) 1px,
      transparent 1px, transparent 3px
    );
    pointer-events: none;
    z-index: 1000;
  }

  header {
    padding: 20px 28px;
    border-bottom: 1px solid var(--grid);
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
  }

  h1 {
    font-family: 'Orbitron', sans-serif;
    font-weight: 900;
    font-size: 1.4rem;
    letter-spacing: 3px;
    color: var(--cyan);
    text-shadow: 0 0 20px rgba(77,232,224,0.4);
  }

  h1 span { color: var(--violet); }

  .status-row {
    display: flex;
    gap: 18px;
    font-size: 0.75rem;
    color: var(--text-dim);
  }

  .status-dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    margin-right: 6px;
    background: var(--text-dim);
  }

  .status-dot.online { background: var(--cyan); box-shadow: 0 0 8px var(--cyan); }
  .status-dot.offline { background: var(--red); box-shadow: 0 0 8px var(--red); }

  main {
    display: grid;
    grid-template-columns: 1.4fr 1fr;
    gap: 1px;
    background: var(--grid);
  }

  @media (max-width: 900px) {
    main { grid-template-columns: 1fr; }
  }

  section {
    background: var(--bg);
    padding: 22px;
  }

  .panel-title {
    font-family: 'Orbitron', sans-serif;
    font-size: 0.85rem;
    letter-spacing: 2px;
    color: var(--violet);
    margin-bottom: 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  /* ---- Wereldkaart / tracking ---- */
  #map-wrapper {
    position: relative;
    border: 1px solid var(--grid);
    background: var(--panel);
    aspect-ratio: 2 / 1;
    overflow: hidden;
  }

  #worldmap { width: 100%; height: 100%; display: block; }

  .scanline {
    position: absolute;
    top: 0;
    left: 0;
    width: 3px;
    height: 100%;
    background: linear-gradient(180deg, transparent, var(--cyan), transparent);
    opacity: 0.6;
    animation: sweep 6s linear infinite;
    pointer-events: none;
  }

  @keyframes sweep {
    0% { left: 0%; }
    100% { left: 100%; }
  }

  .group-select {
    display: flex;
    gap: 8px;
    margin-bottom: 14px;
    flex-wrap: wrap;
  }

  .chip {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.7rem;
    letter-spacing: 1px;
    padding: 6px 12px;
    border: 1px solid var(--grid);
    background: var(--panel);
    color: var(--text-dim);
    cursor: pointer;
    transition: all 0.15s ease;
  }

  .chip:hover { border-color: var(--cyan); color: var(--cyan); }
  .chip.active { border-color: var(--cyan); color: var(--cyan); background: rgba(77,232,224,0.08); }

  .sat-list {
    margin-top: 14px;
    max-height: 220px;
    overflow-y: auto;
    font-size: 0.72rem;
  }

  .sat-row {
    display: grid;
    grid-template-columns: 1fr auto auto;
    gap: 10px;
    padding: 6px 8px;
    border-bottom: 1px solid var(--grid);
    color: var(--text-dim);
  }

  .sat-row:hover { background: rgba(77,232,224,0.05); color: var(--text); }
  .sat-row .name { color: var(--text); }
  .sat-row .cyan-val { color: var(--cyan); }

  /* ---- Orbit simulator ---- */
  .controls { display: flex; flex-direction: column; gap: 16px; margin-bottom: 20px; }

  .control-group label {
    display: flex;
    justify-content: space-between;
    font-size: 0.72rem;
    color: var(--text-dim);
    margin-bottom: 6px;
    letter-spacing: 0.5px;
  }

  .control-group label .val { color: var(--cyan); font-weight: 700; }

  input[type="range"] {
    -webkit-appearance: none;
    width: 100%;
    height: 2px;
    background: var(--grid);
    outline: none;
  }

  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: var(--cyan);
    cursor: pointer;
    box-shadow: 0 0 10px rgba(77,232,224,0.6);
  }

  #orbit-canvas-wrapper {
    border: 1px solid var(--grid);
    background: var(--panel);
    aspect-ratio: 1 / 1;
    margin-bottom: 18px;
  }

  #orbitcanvas { width: 100%; height: 100%; display: block; }

  .telemetry {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1px;
    background: var(--grid);
    border: 1px solid var(--grid);
  }

  .telemetry-cell {
    background: var(--panel);
    padding: 12px 14px;
  }

  .telemetry-cell .label {
    font-size: 0.65rem;
    color: var(--text-dim);
    letter-spacing: 1px;
    margin-bottom: 4px;
  }

  .telemetry-cell .value {
    font-family: 'Orbitron', sans-serif;
    font-size: 1.05rem;
    color: var(--violet);
  }

  .error-box {
    border: 1px solid var(--red);
    color: var(--red);
    padding: 10px 14px;
    font-size: 0.75rem;
    margin-top: 12px;
    display: none;
  }

  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: var(--panel); }
  ::-webkit-scrollbar-thumb { background: var(--grid); }
</style>
</head>
<body>

<header>
  <h1>ABEL123 :: <span>ORBITAL SENTINEL</span></h1>
  <div class="status-row">
    <span><span class="status-dot" id="dot-java"></span>JAVA CORE</span>
    <span><span class="status-dot" id="dot-python"></span>PYTHON TLE-LINK</span>
  </div>
</header>

<main>
  <!-- LIVE TRACKING -->
  <section>
    <div class="panel-title">
      <span>&gt; LIVE GROUND TRACK</span>
      <span id="sat-count" style="color: var(--text-dim); font-weight: 400;">-- objects</span>
    </div>

    <div class="group-select">
      <div class="chip active" data-group="stations">STATIONS</div>
      <div class="chip" data-group="starlink">STARLINK</div>
      <div class="chip" data-group="science">SCIENCE</div>
      <div class="chip" data-group="weather">WEATHER</div>
    </div>

    <div id="map-wrapper">
      <canvas id="worldmap"></canvas>
      <div class="scanline"></div>
    </div>

    <div class="sat-list" id="sat-list"></div>
    <div class="error-box" id="tracking-error"></div>
  </section>

  <!-- ORBIT SIMULATOR -->
  <section>
    <div class="panel-title">
      <span>&gt; ORBIT SIMULATOR</span>
      <span style="color: var(--text-dim); font-weight: 400;">KEPLER ENGINE</span>
    </div>

    <div class="controls">
      <div class="control-group">
        <label>ALTITUDE (PERIGEE) <span class="val" id="alt-val">400 km</span></label>
        <input type="range" id="alt-slider" min="150" max="40000" step="10" value="400">
      </div>
      <div class="control-group">
        <label>INCLINATION <span class="val" id="inc-val">51.6&deg;</span></label>
        <input type="range" id="inc-slider" min="0" max="180" step="0.1" value="51.6">
      </div>
      <div class="control-group">
        <label>ECCENTRICITY <span class="val" id="ecc-val">0.000</span></label>
        <input type="range" id="ecc-slider" min="0" max="0.9" step="0.005" value="0">
      </div>
    </div>

    <div id="orbit-canvas-wrapper">
      <canvas id="orbitcanvas"></canvas>
    </div>

    <div class="telemetry">
      <div class="telemetry-cell">
        <div class="label">PERIOD</div>
        <div class="value" id="tm-period">-- min</div>
      </div>
      <div class="telemetry-cell">
        <div class="label">VELOCITY (PERIGEE)</div>
        <div class="value" id="tm-velocity">-- km/s</div>
      </div>
      <div class="telemetry-cell">
        <div class="label">APOGEE ALT</div>
        <div class="value" id="tm-apogee">-- km</div>
      </div>
      <div class="telemetry-cell">
        <div class="label">SEMI-MAJOR AXIS</div>
        <div class="value" id="tm-sma">-- km</div>
      </div>
    </div>
    <div class="error-box" id="orbit-error"></div>
  </section>
</main>

<script src="app.js"></script>
</body>
</html>
